program: scripts/train_router_ppo.py
name: router-ppo-reward-weights-grid81
method: grid
metric:
  goal: maximize
  name: eval/accuracy_per_joule
parameters:
  # Fixed to the provided training command.
  batch-size:
    value: 256
  cached-output-dir:
    value: model_outputs
  checkpoint-metric:
    value: eval/accuracy_per_joule
  encoder-name:
    value: sentence-transformers/all-MiniLM-L6-v2
  encoder-training-mode:
    value: frozen
  learning-rate:
    value: 0.00090452257881141
  n-steps:
    value: 1024
  outcome-source:
    value: cached
  ppo-epochs:
    value: 5
  reward-alpha:
    value: 1.0
  reward-beta:
    values: [0.0, 0.25, 0.75, 1.5, 3.0, 5.0, 7.5]
  reward-gamma:
    values: [0.0, 0.25, 0.75, 1.5, 3.0, 5.0, 7.5]
  latency-norm-s:
    value: 3.0
  energy-norm-j:
    value: 200.0
  total-timesteps:
    value: 300000
  train-limit:
    value: 2048
  train-split:
    value: test
  val-limit:
    value: 256
  val-split:
    value: validation
  wandb-mode:
    value: online
  wandb-project:
    value: llm-router
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
